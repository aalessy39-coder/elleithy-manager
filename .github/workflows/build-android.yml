name: Build ELLEITHY MANAGER APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find Android project
        run: |
          find . -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          if [ -f "FleetManagerPro_Android/gradlew" ]; then
            cd FleetManagerPro_Android
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Android project or Gradle wrapper not found."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELLEITHY-MANAGER-APK
          path: |
            FleetManagerPro_Android/app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
