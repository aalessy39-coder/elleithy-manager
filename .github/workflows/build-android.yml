name: Build ELLEITHY MANAGER APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p extracted
          if [ -f FleetManagerPro_MultiPlatform.zip ]; then
            unzip -o FleetManagerPro_MultiPlatform.zip -d extracted
          elif [ -f FleetManagerPro_Android.zip ]; then
            unzip -o FleetManagerPro_Android.zip -d extracted
          else
            echo "ERROR: ZIP file not found"
            exit 1
          fi

      - name: Find project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found inside ZIP"
            exit 1
          fi
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        shell: bash
        run: |
          gradle -p "${{ steps.project.outputs.dir }}" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELLEITHY-MANAGER-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
